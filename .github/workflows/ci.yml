name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  secretos:
    name: Detección de credenciales
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sintaxis:
    name: Sintaxis PHP 8.5
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Instalar PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validar sintaxis PHP
        run: |
          find app config public tests \
            -name '*.php' \
            -not -path '*/vendor/*' \
            -print0 |
          xargs -0 -n1 php -l